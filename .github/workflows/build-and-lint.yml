name: CI - Build and Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out your code
        uses: actions/checkout@v4
        with:
          submodules: true # To handle your frontend/ui

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # THE FIX: Points to the root requirements.txt
          pip install -r requirements.txt
          pip install ruff

      - name: 4. Lint code with Ruff
        # This is correct: lints your code inside backend/
        run: |
          ruff check backend/

      - name: 5. Build Docker image
        run: |
          # THE FIX:
          # Build context is '.' (the root)
          # File is 'backend/Dockerfile'
          docker build . --file backend/Dockerfile --tag my-visa-app:${{ github.sha }}