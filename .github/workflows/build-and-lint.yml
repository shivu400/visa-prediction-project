name: CI - Build and Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out your code
        uses: actions/checkout@v4
        # ⭐️⭐️⭐️ THE FIX ⭐️⭐️⭐️
        # We have REMOVED 'submodules: true' from this step.
        # The pipeline will now stop trying to fetch 'frontend/ui'.

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: 4. Lint code with Ruff
        run: |
          ruff check backend/app/ --ignore T201

      - name: 5. Build Docker image
        run: |
          docker build . --file backend/Dockerfile --tag my-visa-app:${{ github.sha }}