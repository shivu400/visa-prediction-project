name: CI - Build and Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out your code
        uses: actions/checkout@v4
        # We must also check out the submodule to clean it
        with:
          submodules: true

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Point to the requirements file inside the backend folder
          pip install -r backend/requirements.txt
          pip install ruff

      - name: 4. Lint code with Ruff
        # This path is still correct
        run: |
          ruff check backend/

      - name: 5. Build Docker image
        # This is the most important fix
        # We tell Docker to:
        # 1. Use 'backend/' as the "build context" (so it can find all the code)
        # 2. Use 'backend/Dockerfile' as the "file"
        run: |
          docker build backend/ --file backend/Dockerfile --tag my-visa-app:${{ github.sha }}